<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماشین حساب</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f4f9);
            --text-color: var(--tg-theme-text-color, #222);
            --btn-bg: var(--tg-theme-button-color, #0088cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --sec-bg: var(--tg-theme-secondary-bg-color, #ffffff);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calc {
            background-color: var(--sec-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 280px;
        }
        #display {
            width: 100%;
            height: 55px;
            font-size: 26px;
            text-align: left;
            margin-bottom: 15px;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            height: 50px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
        }
        button:active { opacity: 0.7; }
        button.op { background: var(--btn-bg); color: var(--btn-text); }
        button.eq { background: #34c759; color: white; grid-column: span 2; }
        button.c { background: #ff3b30; color: white; }
    </style>
</head>
<body>
<div class="calc">
    <input type="text" id="display" readonly value="0">
    <div class="grid">
        <button class="c" onclick="c()">C</button>
        <button class="op" onclick="a('/')">÷</button>
        <button class="op" onclick="a('*')">×</button>
        <button class="op" onclick="del()">⌫</button>
        <button onclick="a('7')">7</button><button onclick="a('8')">8</button><button onclick="a('9')">9</button>
        <button class="op" onclick="a('-')">-</button>
        <button onclick="a('4')">4</button><button onclick="a('5')">5</button><button onclick="a('6')">6</button>
        <button class="op" onclick="a('+')">+</button>
        <button onclick="a('1')">1</button><button onclick="a('2')">2</button><button onclick="a('3')">3</button>
        <button onclick="a('.')">.</button>
        <button onclick="a('0')">0</button>
        <button class="eq" onclick="calc()">=</button>
    </div>
</div>
<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const d = document.getElementById('display');
    function a(v) { d.value = d.value === '0' && v !== '.' ? v : d.value + v; }
    function c() { d.value = '0'; }
    function del() { d.value = d.value.length > 1 ? d.value.slice(0, -1) : '0'; }
    function calc() { try { d.value = eval(d.value); } catch { d.value = 'خطا'; setTimeout(c, 1000); } }
</script>
</body>
</html>
